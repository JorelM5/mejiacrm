<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#161616">
<title>CRM Mejía</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%232148FF%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 font-family=%22Arial%22 fill=%22white%22 text-anchor=%22middle%22>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="toastHost" class="toast-host" aria-live="polite"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">M</span>
      <div class="brand-text">
        <span class="brand-name">CRM Mejía</span>
        <span class="brand-sub">Clientes &amp; proyectos</span>
      </div>
    </div>

    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar cliente, teléfono o correo…" autocomplete="off">
    </div>

    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btnBackup" title="Respaldo y restauración">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="btn-label">Respaldo</span>
      </button>
      <button class="btn btn-primary" id="btnNewClient">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="btn-label">Nuevo cliente</span>
      </button>
    </div>
  </div>

  <nav class="tabbar">
    <button class="tab active" data-view="clients">
      <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="2"/><path d="M3.5 20c.8-3.6 3-5.4 5.5-5.4s4.7 1.8 5.5 5.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17.5" cy="9" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M15 20c.5-2.5 1.8-4 3.6-4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Clientes
    </button>
    <button class="tab" data-view="calendar">
      <svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Calendario
      <span id="conflictBadge" class="badge-alert hidden">0</span>
    </button>
  </nav>
</header>

<main id="app"></main>

<div id="modalRoot"></div>

<script src="js/app.js"></script>
</body>
</html>
